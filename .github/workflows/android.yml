name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project Files
        run: |
          unzip *.zip
          # Hunt for the directory containing pubspec.yaml and pull everything up
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ "$FLUTTER_DIR" != "." ] && [ ! -z "$FLUTTER_DIR" ]; then
            mv "$FLUTTER_DIR"/* . 2>/dev/null || true
            mv "$FLUTTER_DIR"/.* . 2>/dev/null || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
