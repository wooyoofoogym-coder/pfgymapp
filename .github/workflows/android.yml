name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Unzip Tool
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip Project Files
        run: unzip *.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK (Deep Search Mode)
        run: |
          # Find where the project file actually is and build right there
          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ ! -z "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "Error: Could not find project files anywhere in the zip."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
